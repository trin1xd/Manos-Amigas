name: Pruebas migración PostgreSQL

on:
  push:
    branches: [migracion-supabase]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: clave-de-pruebas-no-usar-en-produccion
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxis de Python
        run: python -m compileall -q database repositories services
      - name: Pruebas unitarias PostgreSQL sin conexión externa
        run: python -m pytest -q tests/test_postgres_*.py
