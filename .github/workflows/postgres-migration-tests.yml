name: Pruebas migración PostgreSQL

on:
  push:
    branches: [migracion-supabase]
  pull_request:
    branches: [migracion-supabase]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: clave-de-pruebas-no-usar-en-produccion
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar sintaxis de Python
        run: python -m compileall -q database repositories services routes tests
      - name: Pruebas unitarias PostgreSQL sin conexión externa
        run: python -m pytest -q tests/test_postgres_*.py tests/test_seguimiento.py tests/test_calificaciones.py tests/test_correo_https.py tests/test_verificacion_correo.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar frontend
        run: npm run build
